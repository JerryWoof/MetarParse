name: Keeper

# Fallback timer: GitHub's cron scheduler can be delayed for hours (it never
# fired for this repo's first day). This job stays alive for ~5.5 h, dispatches
# the Pages rebuild every 30 minutes, then re-dispatches itself.
on:
  workflow_dispatch:
  schedule:
    - cron: "15 */6 * * *"

permissions:
  actions: write
  contents: read

concurrency:
  group: keeper
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
    steps:
      - name: Dispatch the map rebuild every 30 minutes
        run: |
          end=$(( $(date +%s) + 330*60 ))
          last=""
          while [ "$(date +%s)" -lt "$end" ]; do
            slot=$(date -u +%Y%m%d%H)$(( 10#$(date -u +%M) / 30 ))
            if [ "$last" != "$slot" ]; then
              gh workflow run pages.yml --repo "$REPO" && last=$slot
            fi
            sleep 60
          done
      # Retire once GitHub's own cron works: if pages.yml had at least 4 scheduled
      # runs in the last 3 hours (cron keeping pace, not just one stray run), retire.
      - name: Hand over to the next keeper (unless cron works)
        if: always()
        run: |
          since=$(date -u -d '3 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          n=$(gh run list --repo "$REPO" --workflow pages.yml --event schedule --limit 20 \
                --json createdAt --jq "[.[] | select(.createdAt > \"$since\")] | length")
          if [ "${n:-0}" -ge 4 ]; then
            echo "GitHub cron is running ($n scheduled runs in 3 h); keeper retires."
          else
            gh workflow run keeper.yml --repo "$REPO"
          fi

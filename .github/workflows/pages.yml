name: Pages

# Rebuilds the MetarParse Live map: downloads the latest aviationweather.gov
# caches, decodes them with the library from this commit and deploys site/.

on:
  schedule:
    - cron: "*/30 * * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install MetarParse
        run: python -m pip install .
      # Fails the job (exit 1) if the download fails or yields no METARs,
      # so an empty map is never deployed.
      - name: Build map data
        run: python scripts/build_site_data.py --out site/data
      - name: Build wheel for the in-browser decoder
        run: python -m pip wheel . --no-deps -w site/pkg
      - name: Check wheel matches meta.json
        run: |
          wheel=$(python -c "import json; print(json.load(open('site/data/meta.json'))['wheel'])")
          test -f "site/$wheel" || { echo "missing site/$wheel"; ls site/pkg; exit 1; }
      - name: Drop build-only files
        run: rm -f site/DATA_FORMAT.md
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

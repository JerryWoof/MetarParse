<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MetarParse Live</title>
<meta name="description" content="Live airport weather for the whole world: flight categories, wind, temperature, weather and TAF timelines for ~5,000 stations, decoded by the open-source MetarParse Python library.">
<meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b1120" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta property="og:type" content="website">
<meta property="og:title" content="MetarParse Live — world airport weather">
<meta property="og:description" content="Every METAR and TAF on Earth on one map, decoded in plain English by the open-source MetarParse library.">
<meta property="og:url" content="https://jerrywoof.github.io/MetarParse/">
<meta property="og:site_name" content="MetarParse Live">
<meta name="twitter:card" content="summary">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
<link rel="stylesheet" href="style.css">
</head>
<body>
<a class="skip" href="#search-input">Skip to search</a>

<header class="topbar">
  <div class="brand">
    <svg class="brand-mark" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="#0f172a"/><circle cx="32" cy="32" r="22" fill="none" stroke="#334155" stroke-width="2.5"/><circle cx="32" cy="32" r="12" fill="none" stroke="#334155" stroke-width="2.5"/><path d="M32 32 L32 10 A22 22 0 0 1 51 21 Z" fill="#22c55e" opacity=".35"/><circle cx="32" cy="32" r="4" fill="#e2e8f0"/><circle cx="44" cy="20" r="5" fill="#22c55e"/><circle cx="21" cy="42" r="4" fill="#3b82f6"/><circle cx="45" cy="44" r="3.5" fill="#ef4444"/></svg>
    <div class="brand-text">
      <h1>MetarParse Live</h1>
      <p class="status" id="status"><span class="live-dot" aria-hidden="true"></span><span id="updated">Loading…</span><span class="sep" aria-hidden="true">·</span><span id="count"></span></p>
    </div>
  </div>

  <div class="search" role="search">
    <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="search-input" type="search" autocomplete="off" spellcheck="false"
      placeholder="Search ICAO, IATA or airport name" aria-label="Search airports"
      role="combobox" aria-expanded="false" aria-controls="search-list" aria-autocomplete="list">
    <kbd class="search-kbd" aria-hidden="true">/</kbd>
    <ul id="search-list" class="search-list" role="listbox" aria-label="Matching airports" hidden></ul>
  </div>

  <div class="top-actions">
    <div class="badge-group wide-only" id="lib-badge-top"></div>
    <button class="btn icon-btn" id="near-btn" type="button" title="Nearest station to me" aria-label="Find nearest station to my location">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.5"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="7.5"/></svg>
      <span class="btn-label">Near me</span>
    </button>
    <div class="menu" id="units-menu">
      <button class="btn icon-btn" id="units-btn" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="units-pop" title="Units">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
        <span class="btn-label">Units</span>
      </button>
      <div class="popover" id="units-pop" hidden>
        <div class="pop-row"><span>Temperature</span><div class="seg small" data-unit="temp"><button type="button" data-v="C">°C</button><button type="button" data-v="F">°F</button></div></div>
        <div class="pop-row"><span>Wind</span><div class="seg small" data-unit="wind"><button type="button" data-v="kt">kt</button><button type="button" data-v="kmh">km/h</button></div></div>
        <div class="pop-row"><span>Visibility</span><div class="seg small" data-unit="vis"><button type="button" data-v="m">km/m</button><button type="button" data-v="sm">SM</button></div></div>
      </div>
    </div>
    <a class="btn" href="decode.html" title="Paste any METAR and decode it in your browser">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 7-5 5 5 5M16 7l5 5-5 5"/></svg>
      <span class="btn-label">Decode a METAR</span>
    </a>
    <a class="btn icon-btn" href="https://github.com/JerryWoof/MetarParse" title="MetarParse on GitHub" aria-label="MetarParse on GitHub" rel="noopener">
      <svg viewBox="0 0 16 16" aria-hidden="true" class="fill"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
    </a>
  </div>
</header>

<main class="stage">
  <div id="map" aria-label="World map of airport weather stations"></div>

  <section class="card side" id="side" aria-label="Right now">
    <button class="side-toggle" id="side-toggle" type="button" aria-expanded="true" aria-controls="side-body">
      <span class="side-title"><span class="pulse" aria-hidden="true"></span>Right now</span>
      <span class="side-summary" id="side-summary"></span>
      <svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
    </button>
    <div class="side-body" id="side-body">
      <div class="catbar" id="catbar" aria-label="Stations per flight category"></div>
      <div class="catchips" id="catchips"></div>
      <div class="tabs" role="tablist" id="rn-tabs" aria-label="Extremes">
        <button role="tab" type="button" data-tab="gust">Gusts</button>
        <button role="tab" type="button" data-tab="ts">Storms</button>
        <button role="tab" type="button" data-tab="cold">Coldest</button>
        <button role="tab" type="button" data-tab="hot">Hottest</button>
        <button role="tab" type="button" data-tab="vis">Low vis</button>
      </div>
      <ol class="rn-list" id="rn-list" role="tabpanel" aria-labelledby=""></ol>

      <h2 class="sub-h"><svg viewBox="0 0 24 24" aria-hidden="true" class="star-ic"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></svg>Favourites</h2>
      <ul class="fav-list" id="fav-list"></ul>

      <div class="about narrow-only" id="lib-badge-side"></div>
      <p class="fineprint">Data: <a href="https://aviationweather.gov" rel="noopener">aviationweather.gov</a> (NOAA). Not for operational use — not an official flight briefing.</p>
    </div>
  </section>

  <div class="card layers" id="layers">
    <div class="seg layer-seg" role="radiogroup" aria-label="Map layer" id="layer-seg">
      <button type="button" role="radio" data-layer="cat">Flight cat.</button>
      <button type="button" role="radio" data-layer="temp">Temp</button>
      <button type="button" role="radio" data-layer="wind">Wind</button>
      <button type="button" role="radio" data-layer="wx">Weather</button>
      <button type="button" role="radio" data-layer="age">Data age</button>
    </div>
    <div class="legend" id="legend" aria-live="polite"></div>
  </div>

  <aside class="station" id="station" aria-label="Station details" hidden>
    <div class="sheet-handle" aria-hidden="true"></div>
    <div id="station-body"></div>
  </aside>

  <div class="loading" id="loading" role="status"><div class="spinner" aria-hidden="true"></div><span>Loading world weather…</span></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</main>

<noscript><p class="noscript">MetarParse Live needs JavaScript to draw the map.</p></noscript>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script type="module" src="app.js"></script>
</body>
</html>

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "metar-parse"
version = "0.1.0"
description = "Fast, tolerant METAR & TAF parser for Python. Decodes raw aviation weather reports into clean JSON."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "Vojtech Kraus" }]
keywords = ["metar", "taf", "aviation", "weather", "meteorology", "parser"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5"]

[project.scripts]
metar = "metar_parse.cli:main"

[project.urls]
Homepage = "https://github.com/JerryWoof/MetarParse"
Issues = "https://github.com/JerryWoof/MetarParse/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/metar_parse"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["UP006", "UP007", "UP035", "UP045"]
